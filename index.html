<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#171415">
  <meta name="description" content="a little birthday present from your birthday buddy">

  <title>for Fiona 🩵</title>
  <link rel="canonical" href="https://cyan-fox-avery.github.io/for-fiona/">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cyan-fox-avery.github.io/for-fiona/">
  <meta property="og:title" content="for Fiona 🩵">
  <meta property="og:description" content="a little birthday present from your birthday buddy">
  <meta property="og:image" content="https://cyan-fox-avery.github.io/for-fiona/preview.png?v=1">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A cream birthday envelope on a dark background reading do not open until September 28.">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="for Fiona 🩵">
  <meta name="twitter:description" content="a little birthday present from your birthday buddy">
  <meta name="twitter:image" content="https://cyan-fox-avery.github.io/for-fiona/preview.png?v=1">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩵</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>

  <main class="stage">
    <section class="gift" id="gift" aria-labelledby="gift-title">
      <p class="kicker">special delivery</p>

      <div class="envelope-wrap" aria-hidden="true">
        <div class="envelope-shadow"></div>
        <div class="envelope">
          <div class="envelope-back"></div>

          <div class="letter">
            <span class="letter-kicker">for Fiona</span>
            <strong>27 things</strong>
            <span class="letter-mark">✦</span>
          </div>

          <div class="front-left"></div>
          <div class="front-right"></div>
          <div class="front-bottom"></div>

          <div class="ribbon ribbon-vertical"></div>
          <div class="ribbon ribbon-horizontal"></div>

          <div class="label">
            <div class="label-text">
              <div class="label-row"><span>TO</span><strong>Fiona</strong></div>
              <div class="label-row"><span>FROM</span><strong>Avery</strong></div>
            </div>
          </div>

          <div class="flap"></div>
          <div class="seal"><span>✦</span></div>
        </div>
      </div>

      <div class="copy">
        <h1 id="gift-title">for Fiona <span aria-hidden="true">🩵</span></h1>
        <p>do not open until September 28</p>
      </div>

      <a class="open-button" id="open-button" href="https://cyan-fox-avery.github.io/27-things/">
        <span>open your present</span>
        <span class="button-star" aria-hidden="true">✦</span>
      </a>

      <p class="tiny-note" id="tiny-note">best opened somewhere you can take your time</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
